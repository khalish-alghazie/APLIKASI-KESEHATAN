<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Selaras — Ritme Sehat Tanpa Beban</title>

  <!-- Google Fonts: Newsreader (Serif), Plus Jakarta Sans (UI Sans), JetBrains Mono (Tabular Num) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/breathing.css">
</head>
<body>

  <!-- ======================================================================
       SIMULATOR BACKDROP (DESKTOP PRESENTATION & DEMO MODE)
       ====================================================================== -->
  <div class="simulator-backdrop">
    
    <!-- Top Demo Controls (Khusus Juri & Pengujian Kompetisi) -->
    <header class="simulator-controls" role="toolbar" aria-label="Demo Bar">
      <div class="brand-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3"/>
        </svg>
        <span>Selaras Mobile App</span>
      </div>

      <!-- Skenario Switcher Quiet Intelligence -->
      <div class="control-group">
        <span style="font-size:11.5px; color:var(--color-ink-secondary); font-weight:600;">Simulasi Skenario:</span>
        <button 
          class="control-btn active" 
          id="btn-scen-stress"
          onclick="window.SelarasStore.setScenario('stress_detected'); document.querySelectorAll('.control-group .control-btn').forEach(b => b.classList.remove('active')); this.classList.add('active'); window.SelarasApp.showToast('Skenario: Stres Rapat Aktif (HRV 48ms)', '⚡');">
          ⚡ Stres Rapat
        </button>
        <button 
          class="control-btn" 
          id="btn-scen-morning"
          onclick="window.SelarasStore.setScenario('morning_readiness'); document.querySelectorAll('.control-group .control-btn').forEach(b => b.classList.remove('active')); this.classList.add('active'); window.SelarasApp.showToast('Skenario: Kesiapan Prima (Skor 84)', '☀️');">
          ☀️ Kesiapan Prima
        </button>
        <button 
          class="control-btn" 
          id="btn-scen-sedentary"
          onclick="window.SelarasStore.setScenario('sedentary_alert'); document.querySelectorAll('.control-group .control-btn').forEach(b => b.classList.remove('active')); this.classList.add('active'); window.SelarasApp.showToast('Skenario: Duduk &gt; 90m (Peregangan Meja)', '🪑');">
          🪑 Duduk &gt; 90m
        </button>
      </div>

      <div class="control-group">
        <button class="control-btn" id="btn-toggle-audio" onclick="window.SelarasApp.toggleAudio()">
          🔔 Audio Organik
        </button>
        <button class="control-btn" id="btn-toggle-view" onclick="window.SelarasApp.toggleDeviceView()">
          🖥️ Layar Penuh
        </button>
      </div>
    </header>

    <!-- ======================================================================
         MOBILE DEVICE FRAME CONTAINER (393 x 852 px / iOS Viewport)
         ====================================================================== -->
    <main class="mobile-device-frame" id="mobile-frame">
      
      <!-- Status Bar & Dynamic Island -->
      <div class="mobile-status-bar">
        <span class="status-time" id="status-time-display">09:41</span>
        
        <div class="island-notch">
          <div class="island-dot"></div>
          <div class="island-camera"></div>
        </div>

        <div class="status-icons">
          <!-- Signal Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M2 20h20L12 4z"/>
          </svg>
          <!-- Wifi Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-4.9-3.5l1.4 1.4C9.6 15 10.7 14.5 12 14.5s2.4.5 3.5 1.4l1.4-1.4C15.4 13.1 13.8 12.5 12 12.5s-3.4.6-4.9 2zm-3.5-3.5l1.4 1.4C6.8 10.9 9.3 10 12 10s5.2.9 7 2.4l1.4-1.4C18.2 9.2 15.2 8.2 12 8.2s-6.2 1-8.4 2.8z"/>
          </svg>
          <!-- Battery Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M17 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h13c1.1 0 2-.9 2-2v-1h1c.6 0 1-.4 1-1v-4c0-.6-.4-1-1-1h-1V8c0-1.1-.9-2-2-2zm0 10H4V8h13v8z"/>
          </svg>
        </div>
      </div>

      <!-- App Viewport Container -->
      <div class="app-viewport">
        
        <!-- Toast Notification Container -->
        <div class="toast-container" id="toast-container" aria-live="polite"></div>

        <!-- Scrollable Main Content -->
        <div class="app-content-scroll" id="app-scroll-container">
          <div id="app-tab-content">
            <!-- Dynamic Tab Content Rendered Here via JS -->
          </div>
        </div>

        <!-- ==================================================================
             THUMB-ZONE BOTTOM NAVIGATION BAR (5 TAB PILAR)
             Hari Ini, Ritme, Nutrisi, Panduan, Lingkar
             ================================================================== -->
        <nav class="bottom-nav-container" aria-label="Navigasi Utama">
          
          <!-- Tab 1: Hari Ini -->
          <button class="nav-tab-item active" data-tab="today" onclick="window.SelarasApp.switchTab('today')">
            <svg viewBox="0 0 24 24">
              <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/>
            </svg>
            <span class="nav-tab-label">Hari Ini</span>
            <span class="nav-active-pip"></span>
          </button>

          <!-- Tab 2: Ritme -->
          <button class="nav-tab-item" data-tab="rhythm" onclick="window.SelarasApp.switchTab('rhythm')">
            <svg viewBox="0 0 24 24">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
            <span class="nav-tab-label">Ritme</span>
            <span class="nav-active-pip"></span>
          </button>

          <!-- Tab 3: Nutrisi -->
          <button class="nav-tab-item" data-tab="nutrition" onclick="window.SelarasApp.switchTab('nutrition')">
            <svg viewBox="0 0 24 24">
              <path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/>
            </svg>
            <span class="nav-tab-label">Nutrisi</span>
            <span class="nav-active-pip"></span>
          </button>

          <!-- Tab 4: Panduan -->
          <button class="nav-tab-item" data-tab="guidance" onclick="window.SelarasApp.switchTab('guidance')">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4M12 8h.01"/>
            </svg>
            <span class="nav-tab-label">Panduan</span>
            <span class="nav-active-pip"></span>
          </button>

          <!-- Tab 5: Lingkar -->
          <button class="nav-tab-item" data-tab="circle" onclick="window.SelarasApp.switchTab('circle')">
            <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
            <span class="nav-tab-label">Lingkar</span>
            <span class="nav-active-pip"></span>
          </button>
        </nav>

        <!-- Home Indicator Bar -->
        <div class="home-indicator-bar"></div>
      </div>

      <!-- ==================================================================
           FULLSCREEN MODAL: BOX BREATHING (PERNAPASAN KOTAK 4-4-4-4)
           Intervensi Regulasi Stres Otomatis (FR-02.2)
           ================================================================== -->
      <section class="breathing-modal-fullscreen" id="breathing-modal" aria-label="Sesi Latihan Napas Kotak">
        
        <div class="breathing-header">
          <button class="breathing-exit-btn" onclick="window.SelarasBreathing.stop()">
            ✕ Selesai Lebih Awal
          </button>
          <div class="breathing-timer-badge" id="breathing-timer-badge">02:00</div>
        </div>

        <div class="breathing-stage">
          <div class="breathing-circle-outer">
            <!-- SVG Circular Countdown Ring -->
            <svg class="breathing-svg-ring" viewBox="0 0 250 250">
              <circle class="breathing-ring-bg" cx="125" cy="125" r="120" />
              <circle class="breathing-ring-progress" id="breathing-progress-circle" cx="125" cy="125" r="120" />
            </svg>

            <!-- Sphere yang Mengembang / Mengempis -->
            <div class="breathing-orb" id="breathing-orb">
              <div class="breathing-phase-countdown" id="breathing-phase-countdown">00:04</div>
            </div>
          </div>

          <div style="margin-top:24px; text-align:center;">
            <div class="breathing-phase-title" id="breathing-phase-title">Tarik Napas Melalui Hidung</div>
            <p class="breathing-hint-text" id="breathing-hint-text">
              Biarkan rongga perut mengembang perlahan.
            </p>
          </div>
        </div>

        <div class="breathing-footer">
          <div class="breathing-hr-strip">
            <span>Pemulihan Detak:</span>
            <span class="breathing-hr-metric" id="breathing-hr-value">82 bpm</span>
            <span>• Saraf Parasimpatis</span>
          </div>

          <button 
            class="context-cta-btn" 
            style="background:var(--color-river); width:auto; padding:10px 24px;"
            onclick="window.SelarasBreathing.finishSession()">
            Selesaikan Sesi & Simpan Pemulihan
          </button>
        </div>
      </section>

      <!-- ==================================================================
           GENERIC MODAL / DRAWER (PRACTITIONER BOOKING & GERAKAN)
           ================================================================== -->
      <div class="modal-overlay" id="consultation-modal">
        <div class="modal-drawer" id="consultation-modal-content">
          <!-- Dynamic Content Injected via JS -->
        </div>
      </div>

    </main>
  </div>

  <!-- Application Logic Scripts -->
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/breathing.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/rhythm.js"></script>
  <script src="js/views/nutrition.js"></script>
  <script src="js/views/guidance.js"></script>
  <script src="js/views/circle.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
